name: Build

on: [push, pull_request]

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the plugin archive
        run: make plugin

      - name: Upload the plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The plugin runs on the DSS builtin Python environment, so there is no
      # code-env spec to pin against. 3.9 is the floor the plugin code targets
      # (no f-strings, .format() throughout); test it and a current version.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: make unit-tests-ci
